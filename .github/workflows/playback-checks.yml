name: Playback structural checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse script and check playback controls
        run: node --test tools/verify-playback.mjs
      - name: Build and validate shareable single-file story
        run: |
          python3 tools/build-portable.py --output dist/aki-hana-full.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('dist/aki-hana-full.html').read_text(encoding='utf-8')
          assert html.count('data:audio/mpeg;base64,') == 22
          assert 'window.AKI_HANA_VOICE' in html
          for scene in range(22):
              assert ('"' + f'{scene:02}' + '":"data:audio/mpeg;base64,') in html
          print('22 embedded narration files verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aki-hana-full-single-html
          path: dist/aki-hana-full.html
          retention-days: 90
