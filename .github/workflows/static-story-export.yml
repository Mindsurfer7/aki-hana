name: Static story — export 44 frames
on:
  push:
    branches:
      - feat/static-story-classic-disney-slides-20261021
    paths:
      - 'scripts/export-static-story.mjs'
      - 'scripts/check-static-story.mjs'
      - 'static-story/viewer-template.html'
      - '.github/workflows/static-story-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render all scenes (two art styles)
        run: node scripts/export-static-story.mjs
      - name: Validate offline presentation assets
        run: node scripts/check-static-story.mjs
      - name: Commit real rendered frames to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-story/classic/ static-story/disney/
          if ! git diff --cached --quiet; then
            git commit -m "build: commit 44 prerendered frames and standalone slide viewers"
            git push origin HEAD:feat/static-story-classic-disney-slides-20261021
          fi
