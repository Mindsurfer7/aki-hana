<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Аки Хана — __VERSION_NAME__ (без анимации)</title>
<style>
:root { color-scheme:light; font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; background:#f7f0e4; color:#382b25; }
* { box-sizing:border-box }
body { margin:0; min-height:100vh; padding:clamp(12px,2vw,30px); }
main { max-width:1330px; margin:auto; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
h1 { font-size:clamp(21px,3vw,33px); margin:0; font-weight:750; }
small,.muted { color:#796b60; }
a { color:#78502b; text-underline-offset:3px; }
nav { display:flex; gap:10px; flex-wrap:wrap; }
nav a { display:inline-block; border:1px solid #cfbaa2; border-radius:25px; padding:8px 13px; text-decoration:none; background:#fff9f0; }
nav a[aria-current="page"] { font-weight:700; background:#e8d6bb; }
figure { margin:0; overflow:hidden; background:#e4d9c9; border-radius:17px; box-shadow:0 7px 26px #3e26131b; }
figure img { display:block; width:100%; height:auto; aspect-ratio:16 / 9; object-fit:contain; }
.story { background:#fff9f2; margin-top:16px; padding:clamp(16px,3vw,25px); border-radius:15px; border:1px solid #e8d9c6; }
.chapter { display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
h2 { font-size:clamp(22px,2.3vw,30px); margin:0; }
#jp { font-size:18px; color:#907c68; }
#body { font-size:clamp(17px,1.9vw,21px); line-height:1.65; margin:12px 0 0; white-space:pre-line; }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px; }
button,select { background:#fffdf9; border:1px solid #b7a38f; color:#382b25; padding:12px 15px; font:inherit; border-radius:10px; cursor:pointer; }
button:focus-visible,select:focus-visible,a:focus-visible { outline:3px solid #bd8952; outline-offset:2px; }
button:disabled { opacity:.43; cursor:default; }
button.primary { background:#875a35; color:#fff; border-color:#875a35; }
select { flex:1; min-width:160px; max-width:340px; }
#count { font-variant-numeric:tabular-nums; white-space:nowrap; }
footer { padding:18px 0; color:#796b60; font-size:13px; }
@media (max-width:600px) { .controls button { flex:1; } figure { border-radius:9px; } .chapter { align-items:center; } }
@media (prefers-reduced-motion:reduce) { * {scroll-behavior:auto!important; transition:none!important; animation:none!important;} }
</style>
</head>
<body>
<main>
<header>
  <div><h1>Аки Хана <small>· __VERSION_NAME__</small></h1><small>22 иллюстрации · без анимации и тяжёлого рендеринга</small></div>
  <nav aria-label="Версии"><a href="../">Все версии</a><a href="../classic/" id="classic-link">До редизайна</a><a href="../disney/" id="disney-link">После редизайна</a></nav>
</header>
<figure><img id="frame" alt="Иллюстрация к сцене" width="1600" height="900" decoding="async"></figure>
<section class="story" aria-live="polite" aria-atomic="true">
  <div class="chapter"><h2 id="ru"></h2><span id="jp" lang="ja"></span></div>
  <p id="body"></p>
  <div class="controls">
    <button id="prev" type="button" aria-label="Предыдущая сцена">← Назад</button>
    <select id="chapters" aria-label="Выбрать сцену"></select>
    <button id="next" type="button" class="primary" aria-label="Следующая сцена">Далее →</button>
    <button id="voice" type="button" title="Озвучка текущей сцены, без фоновой музыки">▶ Озвучка</button>
    <span id="count"></span>
  </div>
</section>
<footer>Картинки WebP уже готовы: никакой Canvas-анимации при просмотре. Листайте стрелками ← → или кнопками. Озвучка включается вручную.</footer>
</main>
<script id="story-data" type="application/json">__STORY_DATA__</script>
<script>
(function () {
  'use strict';
  const slides = JSON.parse(document.getElementById('story-data').textContent);
  const frame = document.getElementById('frame');
  const chapters = document.getElementById('chapters');
  const count = document.getElementById('count');
  const back = document.getElementById('prev');
  const next = document.getElementById('next');
  const voice = document.getElementById('voice');
  const audio = new Audio();
  audio.preload = 'none';
  let current = -1;
  slides.forEach(function (s, i) {
    const option = document.createElement('option');
    option.value = String(i);
    option.textContent = String(i+1) + '. ' + s.titleRu;
    chapters.appendChild(option);
  });
  function stopVoice() { audio.pause(); audio.removeAttribute('src'); audio.load(); voice.textContent = '▶ Озвучка'; }
  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i !== current) stopVoice();
    current = i;
    const slide = slides[i];
    frame.src = slide.image;
    frame.alt = slide.titleRu + ' — иллюстрация ' + String(i+1) + ' из ' + String(slides.length);
    document.getElementById('ru').textContent = slide.titleRu;
    document.getElementById('jp').textContent = slide.titleJa;
    document.getElementById('body').textContent = slide.text;
    count.textContent = String(i+1) + ' / ' + String(slides.length);
    chapters.value = String(i);
    back.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    document.getElementById('classic-link').href = '../classic/#' + String(i+1);
    document.getElementById('disney-link').href = '../disney/#' + String(i+1);
    document.title = 'Аки Хана · ' + slide.titleRu;
    if (location.hash !== '#' + String(i+1)) history.replaceState(null, '', '#' + String(i+1));
  }
  frame.addEventListener('error', function () { frame.alt = 'Не удалось открыть кадр. Проверьте наличие папки frames.'; });
  back.addEventListener('click', function () { show(current-1); });
  next.addEventListener('click', function () { show(current+1); });
  chapters.addEventListener('change', function () { show(Number(chapters.value)); });
  window.addEventListener('hashchange', function () { show(Number(location.hash.slice(1)) - 1 || 0); });
  window.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); show(current+1); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); show(current-1); }
  });
  voice.addEventListener('click', async function () {
    if (!audio.paused) { stopVoice(); return; }
    audio.src = '../../voice/' + String(current).padStart(2, '0') + '.mp3';
    try { await audio.play(); voice.textContent = '■ Остановить'; }
    catch (err) { voice.textContent = 'Озвучка недоступна'; }
  });
  audio.addEventListener('ended', function () { voice.textContent = '▶ Озвучка'; });
  show(Number(location.hash.slice(1)) - 1 || 0);
}());
</script>
</body>
</html>
